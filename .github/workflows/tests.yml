# название
name: Tests
# запускается на git push
on:
  push:
# какие джобы нужно выполнить (каждая ждоба выполняется в совей среде)
jobs:
  test:
    # ненастоящие переменные окружения чтобы бекенд не ругался
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      SECRET_KEY: test-secret-key-for-ci
      FERNET_KEY: QlsmzG9_PhDA_HxJUMdkhmm59r4jfBLGHt49wahRPgM=
      GLITCHTIP_DSN: ""
      SERVICE_COMMISION: "0.01"
      YOOKASSA_SHOP_ID: "test"
      YOOKASSA_SECRET_KEY: "test"
      FRONTEND_URL: "http://localhost:3000"

    # для этой ждобы поднимаем виртуалку с последним убунту
    runs-on: ubuntu-latest

    defaults:
      run:
      # запускаем команды из папки backend
        working-directory: backend
    # какие шаги выполнит ждоба
    steps:
      # клонируем репозиторий на том коммите который был запушен
      - uses: actions/checkout@v4

      # скачиваем и настравиваем питон (это исапользование чужого кода для этого)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # название для шага (чтобы было понятно)
      - name: Install dependencies
      # скачиваем зависимости
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  # линт + security-lint (bandit-правила) + проверка зависимостей на известные CVE
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r requirements.txt

  # eslint/prettier/сборка фронта — раньше вообще не проверялись в CI
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Не hard gate: next/postcss/sharp сейчас тянут известные CVE, но фикс требует
      # бампа next выше запиненной 16.2.4 (см. frontend/AGENTS.md — нестандартная
      # preview-сборка) — апгрейд должен быть осознанным решением, не автоматикой CI.
      - name: npm audit (known CVEs in dependencies)
        run: npm audit --audit-level=high
        continue-on-error: true

  # скан репозитория на закоммиченные секреты (ключи бирж, токены и т.п.)
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
